[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regime-detection-engine"
version = "1.0.0"
description = "A modular Market Regime Detection Engine built around Hidden Markov Models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "hmmlearn>=0.3.0",
    "yfinance>=0.2.40",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "click>=8.1",
    "streamlit>=1.35",
    "scipy>=1.12",
    "supabase>=2.30.0",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
supabase = [
    "supabase>=2.0",
]

[project.scripts]
rde = "rde.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rde"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
